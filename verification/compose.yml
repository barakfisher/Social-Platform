x-app: &app
  build: ../backend
  environment: &runtime
    DATABASE_URL: postgresql+psycopg://social_app:social_app_local@postgres:5432/social
    REDIS_URL: redis://redis:6379/0
    EMBEDDING_API_KEY: ""
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: social_admin
      POSTGRES_PASSWORD: social_admin_local
      POSTGRES_DB: social
    volumes:
      - postgres_verify:/var/lib/postgresql/data
      - ../docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_admin -d social"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis_verify:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://social_admin:social_admin_local@postgres:5432/social
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1::8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    stop_grace_period: 300s
  scheduler:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
volumes:
  postgres_verify:
  redis_verify:
